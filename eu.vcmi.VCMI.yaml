app-id: eu.vcmi.VCMI
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
rename-desktop-file: vcmilauncher.desktop
rename-icon: vcmiclient
command: vcmilauncher
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
  - --share=network
  - --device=all # gamepad and dri
  # Allow access to Discord rich presence.
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  - --filesystem=xdg-run/discord-ipc-0
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - '*.a'
  - '*.la'
  - /share/Catch2
  - /share/doc
  - /share/fuzzylite
  - /share/man
  - /share/bash-completion
modules:
  # For dependencies cf.
  # https://github.com/vcmi/vcmi/blob/develop/CI/linux/before_install.sh
  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=/app --with-libraries=program_options,filesystem,thread,locale,date_time,atomic,iostreams
      - ./b2
      - ./b2 install
    sources:
      - sha256: c46baee75ed4b558cf6553630d0615a147ed582812917b57e6f0839d1954549f
        type: archive
        url: https://archives.boost.io/release/1.92.0/source/boost_1_92_0.zip
        x-checker-data:
          type: anitya
          project-id: 6845
          stable-only: true
          url-template: https://archives.boost.io/release/$version/source/boost_${major}_${minor}_$patch.zip

  - name: minizip
    subdir: contrib/minizip
    sources:
      - sha256: 38ef96b8dfe510d42707d9c781877914792541133e1870841463bfa73f883e32
        type: archive
        url: https://zlib.net/zlib-1.3.1.tar.xz
        #x-checker-data:
        #  type: anitya
        #  project-id: 5303
        #  stable-only: true
        #  url-template: https://zlib.net/zlib-$version.tar.xz
      - type: shell
        commands:
          - rm contrib/minizip/Makefile
          - cd contrib/minizip && autoreconf --install

  - name: onetbb
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -Wno-dev
      - -DTBB_TEST=OFF
    sources:
      - type: archive
        url: https://github.com/oneapi-src/oneTBB/archive/refs/tags/v2023.1.0.tar.gz
        sha256: 191288b52e1e6b17198000b64d77d194bb65e791be46ebc606e9b091781e2070
        x-checker-data:
          type: anitya
          project-id: 227581
          stable-only: true
          url-template: https://github.com/oneapi-src/oneTBB/archive/refs/tags/v$version.tar.gz

  - shared-modules/luajit/luajit.json

  - name: SDL3 # newer than the runtime's bundled SDL3; required by SDL3_mixer's find_package(SDL3 3.4.0)
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=ON
      - -DSDL_TESTS=OFF
      - -DSDL_EXAMPLES=OFF
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz
        sha256: 7322236cd12090c3eb40b9728be4d49c76f66ad17d04369584d4ecad5cf77c68
        x-checker-data:
          type: anitya
          project-id: 375746
          stable-only: true
          url-template: https://github.com/libsdl-org/SDL/releases/download/release-$version/SDL3-$version.tar.gz

  - name: SDL3_image
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DSDLIMAGE_DEPS_SHARED=OFF
      - -DSDLIMAGE_STRICT=ON
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_image/releases/download/release-3.4.6/SDL3_image-3.4.6.tar.gz
        sha256: d2e4637ae700f72e5196b8fbd749850ed2e5e1e09c5a5be8d06ff55aaccf3b01
        x-checker-data:
          type: anitya
          project-id: 4781
          stable-only: true
          url-template: https://github.com/libsdl-org/SDL_image/releases/download/release-$version/SDL3_image-$version.tar.gz

  - name: plutovg # dependency of plutosvg
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=ON
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: archive
        url: https://github.com/sammycage/plutovg/archive/refs/tags/v1.3.3.tar.gz
        sha256: 2b0d17a6e016f47b86f9c00e2cb82600041b1ea1f7d2a00c2d46ae542cbfed3c
        x-checker-data:
          type: anitya
          project-id: 379768
          stable-only: true
          url-template: https://github.com/sammycage/plutovg/archive/refs/tags/v$version.tar.gz

  - name: plutosvg # provides color emoji support for SDL3_ttf
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=ON
      - -DPLUTOSVG_ENABLE_FREETYPE=ON
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: archive
        url: https://github.com/sammycage/plutosvg/archive/refs/tags/v0.0.8.tar.gz
        sha256: 49d5cfe772d3aa10cd4879f2f6e189f5083c08e4c8ea01bf3d5b87c97dfca7d2
        x-checker-data:
          type: anitya
          project-id: 379767
          stable-only: true
          url-template: https://github.com/sammycage/plutosvg/archive/refs/tags/v$version.tar.gz

  - name: SDL3_ttf
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DSDLTTF_STRICT=ON
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_ttf/releases/download/release-3.2.2/SDL3_ttf-3.2.2.tar.gz
        sha256: 63547d58d0185c833213885b635a2c0548201cc8f301e6587c0be1a67e1e045d
        x-checker-data:
          type: anitya
          project-id: 7988
          stable-only: true
          url-template: https://github.com/libsdl-org/SDL_ttf/releases/download/release-$version/SDL3_ttf-$version.tar.gz

  - name: SDL3_mixer
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DSDLMIXER_MOD=OFF
      - -DSDLMIXER_MIDI=OFF
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_mixer/releases/download/release-3.2.4/SDL3_mixer-3.2.4.tar.gz
        sha256: 182a07c745375e113dc740d43964ff21b0be29f29f59876c4dbc4db3d32f6901
        x-checker-data:
          type: anitya
          project-id: 4782
          stable-only: true
          url-template: https://github.com/libsdl-org/SDL_mixer/releases/download/release-$version/SDL3_mixer-$version.tar.gz

  - name: catch2 # dependency of fuzzylite
    config-opts:
      - -Wno-dev
    builddir: true
    buildsystem: cmake-ninja
    sources:
      # version is specified in fuzzylite's CMakeLists.txt:
      # https://github.com/fuzzylite/fuzzylite/blob/03d99e42ed37867deabda61bbedde34e9f4b48f0/CMakeLists.txt#L261C25-L261C33
      - type: archive
        url: https://github.com/catchorg/Catch2/archive/refs/tags/v2.13.10.tar.gz
        sha256: d54a712b7b1d7708bc7a819a8e6e47b2fde9536f487b89ccbca295072a7d9943

  - name: fuzzylite
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/fuzzylite/fuzzylite
        commit: 03d99e42ed37867deabda61bbedde34e9f4b48f0 # includes https://github.com/fuzzylite/fuzzylite/pull/114

  - name: unshield
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/twogood/unshield/archive/refs/tags/1.6.2.tar.gz
        sha256: a937ef596ad94d16e7ed2c8553ad7be305798dcdcfd65ae60210b1e54ab51a2f
        x-checker-data:
          type: anitya
          project-id: 16008
          stable-only: true
          url-template: https://github.com/twogood/unshield/archive/refs/tags/$version.tar.gz

  - name: pandoc # pandoc is only needed for converting the changelog
    buildsystem: simple
    build-commands:
      - install -D bin/pandoc /app/bin/pandoc
    cleanup:
      - '*'
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz
        sha256: 37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6
        x-checker-data:
          type: anitya
          project-id: 2589
          stable-only: true
          url-template: https://github.com/jgm/pandoc/releases/download/$version/pandoc-$version-linux-amd64.tar.gz
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-arm64.tar.gz
        sha256: 56ed5566ec41d22ec9ee0704e6ac0b98ba102e92384efd5306173a22d314c79a
        x-checker-data:
          type: anitya
          project-id: 2589
          stable-only: true
          url-template: https://github.com/jgm/pandoc/releases/download/$version/pandoc-$version-linux-arm64.tar.gz

  - name: libsquish
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_SQUISH_WITH_OPENMP=ON
      - -DBUILD_SHARED_LIBS=ON
    build-options:
      arch:
        x86_64:
          config-opts:
            - -DBUILD_SQUISH_WITH_SSE2=ON
        aarch64:
          config-opts:
            - -DBUILD_SQUISH_WITH_SSE2=OFF
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/libsquish/libsquish-1.15.tgz
        sha256: 628796eeba608866183a61d080d46967c9dda6723bc0a3ec52324c85d2147269
        strip-components: 0
        x-checker-data:
          type: anitya
          project-id: 21493
          stable-only: true
          url-template: https://downloads.sourceforge.net/project/libsquish/libsquish-$version.tgz

  - name: libonnxruntime
    buildsystem: simple
    build-commands:
      - mkdir -p /app/include/onnxruntime
      - cp -r --no-target-directory ./include /app/include/onnxruntime
      - cp -r --no-target-directory ./lib /app/lib64
      - cp -r --no-target-directory ./include /app/include
      - cp -r --no-target-directory ./lib /app/lib
    sources:
      - type: archive
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/onnxruntime-linux-x64-1.29.0.tgz
        sha256: c3fddc4f139a045b0c4902c57410f0694f1c2fdf9b6939fbe38b1aeae7cd14ba
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/microsoft/onnxruntime/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: >
            .assets[]
            | select(.name == ("onnxruntime-linux-x64-" + $version + ".tgz"))
            | .browser_download_url
      - type: archive
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/onnxruntime-linux-aarch64-1.29.0.tgz
        sha256: e1799098ebc054b370f6176a450f158720f297818c613e5dc99b92e2ec82346f
        only-arches:
          - aarch64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/microsoft/onnxruntime/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: >
            .assets[]
            | select(.name | test("onnxruntime-linux-aarch64-.*\\.tgz$"))
            | .browser_download_url

  - name: glaze
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    builddir: true
    sources:
      - type: archive
        url: https://github.com/stephenberry/glaze/archive/v8.3.0.tar.gz
        sha256: 6a8f97f5cdb8df5c87f1b32710679585f3f1a577b67bb66150f2516072e00317
        x-checker-data:
          type: anitya
          project-id: 377101
          url-template: https://github.com/stephenberry/glaze/archive/v$version.tar.gz

  - name: vcmi
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DENABLE_GITVERSION=OFF
      - -DFORCE_BUNDLED_FL=OFF
      - -DLIB_DIR=lib
      - -DENABLE_TEST=0
      - -DENABLE_GOLDMASTER=ON
      - -DENABLE_SDL3=ON
      - -Wno-dev
    sources:
      - type: git
        url: https://github.com/vcmi/vcmi
        commit: 77eee6cb12b04d0f68f3d970b64c1bf97bb1c374
      - type: file
        path: add_changelog_to_metainfo.py
      - type: inline
        dest: client/lib/discord-presence/cmake # CPM stub
        dest-filename: CPM.cmake
        contents: |
          macro(CPMAddPackage)
          endmacro()
    post-install:
      - cp /app/share/applications/vcmieditor.desktop /app/share/applications/eu.vcmi.VCMI.editor.desktop
      - sed -i 's|Icon=vcmieditor|Icon=eu.vcmi.VCMI.editor|' /app/share/applications/eu.vcmi.VCMI.editor.desktop
      - |
        for res in 32 48 64 128 256; do
          mv /app/share/icons/hicolor/${res}x${res}/apps/vcmieditor.png /app/share/icons/hicolor/${res}x${res}/apps/eu.vcmi.VCMI.editor.png
        done
      - rm -rf /app/share/icons/hicolor/1024x1024 /app/share/icons/hicolor/2048x2048
      - cd ${FLATPAK_BUILDER_BUILDDIR} && python3 ${FLATPAK_BUILDER_BUILDDIR}/add_changelog_to_metainfo.py
